services:
  workload:
    build: ./workload
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  loadgen:
    build: ./load-generator
    network_mode: host
    depends_on:
      workload:
        condition: service_healthy
    environment:
      TARGET_URL: http://localhost:8080/work
      CONCURRENCY: 30
      SLEEP_MS: 20

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      workload:
        condition: service_healthy
