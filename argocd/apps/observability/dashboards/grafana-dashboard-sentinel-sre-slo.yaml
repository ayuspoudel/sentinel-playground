apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-grafana-dashboard-sentinel-sre-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  grafana-dashboard-sentinel-sre-slo.json: |
    {
      "uid": "sentinel-sre-slo",
      "title": "Sentinel-SRE Loadgen ↔ Demo API (SLO)",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Load Generator RPS",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum(rate(loadgen_requests_total[2m]))",
              "legendFormat": "rps"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Demo API p95 Latency (SLO)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(demoapi_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95 latency"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "s"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "5xx Error Rate",
          "gridPos": { "x": 0, "y": 7, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum(rate(demoapi_http_requests_total{status_class=\"5xx\"}[5m])) / sum(rate(demoapi_http_requests_total[5m]))",
              "legendFormat": "error ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.001 },
                  { "color": "red", "value": 0.005 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Error Budget Burn Rate (5m)",
          "gridPos": { "x": 12, "y": 7, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "(sum(rate(demoapi_http_requests_total{status_class=\"5xx\"}[5m])) / sum(rate(demoapi_http_requests_total[5m]))) / 0.001",
              "legendFormat": "burn rate (5m)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 6 },
                  { "color": "red", "value": 14 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Error Budget Burn Rate (1h)",
          "gridPos": { "x": 0, "y": 14, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "(sum(rate(demoapi_http_requests_total{status_class=\"5xx\"}[1h])) / sum(rate(demoapi_http_requests_total[1h]))) / 0.001",
              "legendFormat": "burn rate (1h)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "red", "value": 6 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Server Inflight Requests",
          "gridPos": { "x": 12, "y": 14, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "demoapi_http_inflight_requests",
              "legendFormat": "inflight"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Target Reachable",
          "gridPos": { "x": 0, "y": 21, "w": 24, "h": 6 },
          "targets": [
            {
              "expr": "loadgen_target_up",
              "legendFormat": "up"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        }
      ]
    }
