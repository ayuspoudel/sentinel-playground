apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webhook-server
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ayuspoudel/k8s-admission-webhook.git
    targetRevision: develop
    path: charts/webhook-server

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: webhook-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
