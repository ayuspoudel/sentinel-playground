apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-workload-payments
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ayuspoudel/sentinel-sre
    targetRevision: develop
    path: playground/helm/sentinel-workload 
    helm:
      valueFiles: 
        - values-payments.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel-workload-payments
  syncPolicy:
    automated: 
      prune: true 
      selfHeal: true
    syncOptions: 
      - CreateNamespace=true 
