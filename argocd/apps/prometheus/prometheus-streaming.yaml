apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-streaming
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.6.0
    helm:
      values: |
        crds:
          enabled: false

        grafana:
          enabled: false

        alertmanager:
          enabled: false

        prometheus:
          service:
            type: ClusterIP
            port: 9090

          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-streaming

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
