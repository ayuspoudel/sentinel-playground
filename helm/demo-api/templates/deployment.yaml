apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        sentinel.guard/name: demo-api
    spec:
      containers:
        - name: demoapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: APP_NAME
              value: {{ .Values.env.appName | quote }}
            - name: DEPLOYMENT_NAME
              value: {{ .Values.env.deploymentName | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.env.clusterName | quote }}
            - name: ERROR_RATE
              value: {{ .Values.env.errorRate | quote }}
