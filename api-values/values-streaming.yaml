clusterName: sreCluster

global:
  appGroup: streaming

apps:
  stable:
    enabled: true
    name: stable
    image:
      repository: ayuspoudel/workload-stable
      tag: "1.0.2"
    replicas: 3
    env:
      ERROR_RATE: "0.0"
    labels:
      tier: stable

  flaky:
    enabled: true
    name: flaky
    image:
      repository: ayuspoudel/workload-flaky
      tag: "1.0.1"
    replicas: 2
    env:
      ERROR_RATE: "0.01"
      SPIKE_PROBABILITY: "0.05"
      SPIKE_DURATION_SEC: "10"
      SPIKE_ERROR_RATE: "0.30"
      MAX_LATENCY_MS: "200"
    labels:
      tier: flaky

  canary:
    enabled: true
    name: canary
    image:
      repository: ayuspoudel/workload-canary
      tag: "1.0.3"
    replicas: 1
    env:
      ERROR_RATE: "0.05"
      LATENCY_MS: "400"
    labels:
      tier: canary

service:
  port: 8080
