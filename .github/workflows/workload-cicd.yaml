name: Workload CI/CD
run-name: Ran by ${{ github.actor }}

on:
  push:
    branches: [ develop ]
    paths:
      - "playground/workload-canary/**"
      - "playground/workload-stable/**"
      - "playground/workload-flaky/**"
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout (detect)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workloads
        id: set-matrix
        run: |
          APPS=()

          git diff --name-only HEAD~1 | grep -q playground/workload-canary && APPS+=("canary")
          git diff --name-only HEAD~1 | grep -q playground/workload-stable && APPS+=("stable")
          git diff --name-only HEAD~1 | grep -q playground/workload-flaky && APPS+=("flaky")

          if [ ${#APPS[@]} -eq 0 ]; then
            MATRIX="[]"
          else
            MATRIX=$(printf '%s\n' "${APPS[@]}" | jq -R -s -c 'split("\n")[:-1]')
          fi

          echo "Detected matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT


  release:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}

    env:
      VALUES_FILE: playground/helm/sentinel-workload/values.yaml

    steps:
      - name: Checkout (release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          CURRENT=$(yq e ".apps.${{ matrix.app }}.image.tag" $VALUES_FILE)

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "ERROR: Missing version for ${{ matrix.app }}"
            exit 1
          fi

          echo "Current version: $CURRENT"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          IFS='.' read -r M m p <<< "${{ steps.version.outputs.current }}"
          NEW="$M.$m.$((p+1))"

          echo "New version: $NEW"
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USER }}/workload-${{ matrix.app }}:${{ steps.bump.outputs.new }}"

          echo "Building $IMAGE"
          docker build -t "$IMAGE" ./playground/workload-${{ matrix.app }}

          echo "Pushing $IMAGE"
          docker push "$IMAGE"

      - name: Write change artifact
        run: |
          mkdir -p changes
          jq -n \
            --arg app "${{ matrix.app }}" \
            --arg version "${{ steps.bump.outputs.new }}" \
            '{app: $app, version: $version}' \
            > changes/${{ matrix.app }}.json

      - name: Upload change artifact
        uses: actions/upload-artifact@v4
        with:
          name: workload-change-${{ matrix.app }}
          path: changes/

  gitops:
    needs: release
    runs-on: ubuntu-latest

    env:
      VALUES_FILE: playground/helm/sentinel-workload/values.yaml

    steps:
      - name: Checkout (gitops)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Download change artifacts
        uses: actions/download-artifact@v4
        with:
          path: changes

      - name: Apply GitOps changes
        run: |
            echo "Applying image version updates"

            find changes -name '*.json' | while read -r f; do
            APP=$(jq -r '.app' "$f")
            VERSION=$(jq -r '.version' "$f")

            echo "Updating $APP -> $VERSION"
            yq -i ".apps.${APP}.image.tag = \"${VERSION}\"" $VALUES_FILE
            done


      - name: Commit & push
        run: |
          if git diff --quiet; then
            echo "No GitOps changes detected"
            exit 0
          fi

          git config user.name "sentinel-ci"
          git config user.email "sentinel-ci@users.noreply.github.com"

          git add $VALUES_FILE
          git commit -m "gitops: update workload images"
          git push

  cd-argocd:
    name: CD via Argo CD
    needs: gitops
    runs-on: ubuntu-latest

    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

    steps:
      - name: Install argocd CLI
        run: |
          set -e
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd
          argocd version --client

      - name: Login to Argo CD
        run: |
          set -e
          argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --insecure

      - name: Argo CD status before sync
        run: |
          set +e
          argocd app get sentinel-workload-streaming
          argocd app get sentinel-workload-payments

      - name: Trigger Argo CD sync
        run: |
          set -e
          argocd app sync sentinel-workload-streaming && argocd app sync sentinel-workload-payments

      - name: Watch Argo CD sync
        run: |
          set -e
          argocd app wait sentinel-workload-streaming --sync --health --watch --timeout 300
          argocd app wait sentinel-workload-payments --sync --health --watch --timeout 300

      - name: Show deployed image versions
        run: |
          set -e
          argocd app get sentinel-workload-streaming --output json | jq '.status.summary.images'
          argocd app get sentinel-workload-payments --output json | jq '.status.summary.images'

      - name: Argo CD status after sync
        run: |
          set -e
          argocd app get sentinel-workload-streaming
          argocd app get sentinel-workload-payments
