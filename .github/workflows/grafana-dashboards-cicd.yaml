name: Grafana Dashboards GitOps

on:
  push:
    paths:
      - grafana/dashboard/*.json
  workflow_dispatch:

jobs:
  dashboards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Validate JSON syntax
        run: |
          set -euo pipefail
          for f in grafana/dashboard/*.json; do
            jq empty "$f"
          done

      - name: Validate Grafana dashboard structure
        run: |
          set -euo pipefail
          for f in grafana/dashboard/*.json; do
            jq -e '
              .uid and
              .title and
              .panels and
              (.version | numbers) and
              (.schemaVersion | numbers)
            ' "$f" > /dev/null
          done

      - name: Generate versioned dashboard ConfigMaps
        run: |
          set -euo pipefail

          SRC_DIR="grafana/dashboard"
          OUT_DIR="argocd/apps/observability/dashboards"
          TEMPLATE="grafana/configMap/dashboard-configmap.tpl.yaml"

          mkdir -p "$OUT_DIR"

          for file in "$SRC_DIR"/*.json; do
            uid="$(jq -r '.uid' "$file")"
            version="$(jq -r '.version' "$file")"

            if [ -z "$uid" ] || [ "$uid" = "null" ]; then
              exit 1
            fi

            if [ -z "$version" ] || [ "$version" = "null" ]; then
              exit 1
            fi

            name="grafana-dashboard-${uid}-v${version}"
            out="$OUT_DIR/${name}.yaml"

            cp "$TEMPLATE" "$out"
            sed -i "s/__NAME__/${name}/g" "$out"

            sed 's/^/    /' "$file" > "/tmp/${uid}.json.indented"
            sed -i "/__JSON__/r /tmp/${uid}.json.indented" "$out"
            sed -i "/__JSON__/d" "$out"
          done

      - name: Remove stale dashboard ConfigMaps
        run: |
          set -euo pipefail

          SRC_DIR="grafana/dashboard"
          OUT_DIR="argocd/apps/observability/dashboards"

          declare -A VALID

          for f in "$SRC_DIR"/*.json; do
            uid="$(jq -r '.uid' "$f")"
            version="$(jq -r '.version' "$f")"
            VALID["grafana-dashboard-${uid}-v${version}"]=1
          done

          for cm in "$OUT_DIR"/grafana-dashboard-*.yaml; do
            fname="$(basename "$cm")"
            name="${fname%.yaml}"

            if [ -z "${VALID[$name]+x}" ]; then
              rm -f "$cm"
            fi
          done

      - name: Update kustomization.yaml
        run: |
          set -euo pipefail

          DASHBOARD_DIR="argocd/apps/observability/dashboards"
          KUSTOMIZATION_FILE="$DASHBOARD_DIR/kustomization.yaml"

          if [ ! -f "$KUSTOMIZATION_FILE" ]; then
            exit 1
          fi

          awk '
            BEGIN { in_resources = 0 }
            /^resources:/ { print; in_resources = 1; next }
            in_resources && /^[^[:space:]]/ { in_resources = 0 }
            !in_resources { print }
          ' "$KUSTOMIZATION_FILE" > /tmp/kustomization.base.yaml

          {
            cat /tmp/kustomization.base.yaml
            echo "resources:"
            for f in $(ls "$DASHBOARD_DIR"/grafana-dashboard-*.yaml 2>/dev/null | sort); do
              echo "  - $(basename "$f")"
            done
          } > "$KUSTOMIZATION_FILE"

          if ! grep -q grafana-dashboard- "$KUSTOMIZATION_FILE"; then
            exit 1
          fi

      - name: Commit & push dashboards
        run: |
          set -euo pipefail

          git add argocd/apps/observability/dashboards

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "sentinel-ci"
          git config user.email "sentinel-ci@users.noreply.github.com"
          git commit -m "grafana: deploy dashboards (versioned, immutable) [skip ci]"
          git push
