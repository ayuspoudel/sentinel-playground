name: Helm Chart Tests
run-name: Test helm chart for commit pushed by - ${{ github.actor }}

on:
  push:
    branches:
      - develop
    paths:
      - "helm/**"

  pull_request:
    paths:
      - "helm/**"
      - "api-values/**"

jobs:
  helm-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Start KinD cluster
        uses: helm/kind-action@v1

      - name: Install Prometheus CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Helm lint (defaults)
        run: helm lint helm/demo-api

      - name: Helm lint (demo values)
        run: helm lint helm/demo-api -f api-values/values-demoapi.yaml

      - name: Helm template
        run: |
          helm template demo-api helm/demo-api \
            -f api-values/values-demoapi.yaml \
            > rendered.yaml

      - name: Kubernetes server-side validation
        run: kubectl apply --dry-run=server -f rendered.yaml

      - name: Install helm-diff plugin
        run: |
          helm plugin remove diff || true
          helm plugin install https://github.com/databus23/helm-diff --version v3.9.5

      - name: Helm diff
        run: |
          helm diff upgrade demo-api helm/demo-api \
            -f api-values/values-demoapi.yaml \
            --allow-unreleased

      - name: Chart version gate (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          CHART_PATH="helm/demo-api"
          CHART_FILE="$CHART_PATH/Chart.yaml"
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          STRUCTURAL_CHANGE=false
          for file in $CHANGED_FILES; do
            if [[ "$file" == "$CHART_PATH/templates/"* ]] || \
               [[ "$file" == "$CHART_PATH/values.yaml" ]] || \
               [[ "$file" == "$CHART_PATH/Chart.yaml" ]]; then
              STRUCTURAL_CHANGE=true
            fi
          done
          if [[ "$STRUCTURAL_CHANGE" == "true" ]]; then
            OLD_VERSION=$(git show origin/main:$CHART_FILE | yq '.version')
            NEW_VERSION=$(yq '.version' "$CHART_FILE")
            if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
              exit 1
            fi
          fi

      - name: Auto-bump chart version on develop
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          set -euo pipefail
          CHART_PATH="helm/demo-api"
          CHART_FILE="$CHART_PATH/Chart.yaml"
          CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          STRUCTURAL_CHANGE=false
          for file in $CHANGED_FILES; do
            if [[ "$file" == "$CHART_PATH/templates/"* ]] || \
               [[ "$file" == "$CHART_PATH/values.yaml" ]] || \
               [[ "$file" == "$CHART_PATH/Chart.yaml" ]]; then
              STRUCTURAL_CHANGE=true
            fi
          done
          if [[ "$STRUCTURAL_CHANGE" != "true" ]]; then
            exit 0
          fi
          CURRENT_VERSION=$(yq '.version' "$CHART_FILE")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          yq -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add "$CHART_FILE"
          git commit -m "chore(chart): auto-bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:develop
